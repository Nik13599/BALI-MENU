name: BALI bonus admin and director browser checks
on:
  pull_request:
    paths:
      - 'bali-qr-admin.js'
      - 'bali-director-id.js'
      - 'director-id.html'
      - 'tests/bonus-admin-correspondence.spec.cjs'
      - '.github/workflows/bali-bonus-admin-browser.yml'
  push:
    branches: [main]
    paths:
      - 'bali-qr-admin.js'
      - 'bali-director-id.js'
      - 'director-id.html'
      - 'tests/bonus-admin-correspondence.spec.cjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Bonus awards/QR work at phone, small phone, tablet and desktop
        run: npx playwright test tests/bonus-admin-correspondence.spec.cjs --workers=2
