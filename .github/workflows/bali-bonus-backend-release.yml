name: BALI Card — protected bonus backend release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bali-bonus-backend-release.yml'
      - 'functions/bonus-qr.js'
      - 'functions/index.js'
      - 'bali-qr-admin.js'
      - 'bali-qr-scanner.js'
  workflow_dispatch:
    inputs:
      confirmation:
        type: choice
        required: true
        description: "A live Firebase credit or debit writes real guestWallets"
        options: ['NO_PRODUCTION_WRITES', 'ENABLE_BALI_BONUS_PRODUCTION']
        default: 'NO_PRODUCTION_WRITES'
permissions:
  contents: read
  id-token: write
concurrency:
  group: bali-bonus-firebase-production
  cancel-in-progress: false
jobs:
  deploy-bonus:
    # Only the explicitly reviewed merge or an acknowledged manual run can
    # deploy money-like club entitlements. Other pushes are test-only.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[deploy-bonus-backend]')) ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'ENABLE_BALI_BONUS_PRODUCTION'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: bali-menu-5a48b
      GCLOUD_PROJECT: bali-menu-5a48b
      FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify production identity and callable syntax
        run: |
          test "$FIREBASE_PROJECT_ID" = "bali-menu-5a48b"
          test -n "$FIREBASE_WIF_PROVIDER"
          test -n "$FIREBASE_DEPLOY_SERVICE_ACCOUNT"
          grep -q '"codebase": "bali-id"' firebase.json
          node --check functions/index.js
          node --check functions/bonus-qr.js
          node --input-type=module --check < bali-qr-admin.js
          node --input-type=module --check < bali-qr-scanner.js
      - name: Install only locked application dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Verify no double grants and 96 simultaneous guest redemptions
        env:
          GCLOUD_PROJECT: demo-bali-menu
        run: |
          node scripts/test-bali-qr.mjs
          npx firebase emulators:exec --config firebase.emulator.json --project demo-bali-menu --only firestore "node scripts/test-bali-qr-firestore.mjs"
      - name: Short-lived Google Cloud identity (no static key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ env.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only bonus catalogue and preview callables
        run: |
          npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only "functions:bali-id:listBaliBonusKinds,functions:bali-id:createBaliBonusKind,functions:bali-id:previewBaliBonusQR,functions:bali-id:listBaliQrCodes" --non-interactive
      - name: Deploy only authorized credit/debit callables
        run: |
          npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only "functions:bali-id:createBaliQrBatch,functions:bali-id:applyBaliBonusQR,functions:bali-id:issueBaliQuantity,functions:bali-id:revokeBaliQrCode" --non-interactive
      - name: Inspect deployed QR code sources without invoking or crediting anyone
        run: node scripts/audit-published-bali-qr.mjs
