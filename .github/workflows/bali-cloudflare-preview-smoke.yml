name: BALI Cloudflare browser preview smoke
on:
  push:
    branches:
      - feature/cloudflare-kv-public-and-event-history
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Cloudflare Pages without private backend files
        run: |
          node cloudflare-pages/build.mjs
          test -f cloudflare-pages/dist/index.html
          test -f cloudflare-pages/dist/admin.html
          test -f cloudflare-pages/dist/preorders.html
          test ! -e cloudflare-pages/dist/firestore.rules
          test ! -e cloudflare-pages/dist/functions/index.js
      - name: Check edge and browser contract
        run: |
          node scripts/test-public-cache.mjs
          node scripts/test-bali-browser-architecture.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser first paint and fallback regression
        run: npx playwright test tests/instant-startup.spec.cjs
