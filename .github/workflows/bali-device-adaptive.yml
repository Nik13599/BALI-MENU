name: BALI device-size adaptation checks
on:
  pull_request:
    paths:
      - 'tests/device-size-matrix.spec.cjs'
      - 'index.html'
      - 'admin.html'
      - 'bali-qr-scanner.js'
      - 'styles/entries.json'
      - '.github/workflows/bali-device-adaptive.yml'
  push:
    branches: [main]
    paths:
      - 'tests/device-size-matrix.spec.cjs'
      - 'index.html'
      - 'admin.html'
      - 'styles/entries.json'
      - '.github/workflows/bali-device-adaptive.yml'
permissions:
  contents: read
jobs:
  viewport-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Confirm static pages fit 12 real viewport sizes
        run: npx playwright test tests/device-size-matrix.spec.cjs --project=phone --workers=1
