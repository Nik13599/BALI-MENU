name: BALI STAFF mobile app and Web Push
on:
  pull_request:
    paths:
      - 'bali-staff*'
      - 'bali-staff.webmanifest'
      - 'preorders.html'
      - 'preorders-access.js'
      - 'cloudflare-pages/functions/_lib/staff-web-push.js'
      - 'cloudflare-pages/functions/api/staff-push.js'
      - 'cloudflare-pages/functions/api/bali-v3.js'
      - 'cloudflare-pages/functions/api/d1-preorders.js'
      - 'cloudflare-pages/functions/_lib/d1-orders.js'
      - 'cloudflare-pages/d1/migrations/0010_staff_web_push.sql'
      - 'scripts/test-staff-web-push.mjs'
      - '.github/workflows/bali-staff-web-push.yml'
  push:
    branches: [main]
    paths:
      - 'bali-staff*'
      - 'preorders.html'
      - 'preorders-access.js'
      - 'cloudflare-pages/functions/_lib/staff-web-push.js'
      - 'cloudflare-pages/functions/api/staff-push.js'
      - 'cloudflare-pages/functions/api/bali-v3.js'
      - 'cloudflare-pages/functions/api/d1-preorders.js'
      - 'cloudflare-pages/functions/_lib/d1-orders.js'
      - '.github/workflows/bali-staff-web-push.yml'
permissions:
  contents: read
jobs:
  verify-web-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse worker, API and browser code
        run: |
          node --input-type=module --check < cloudflare-pages/functions/_lib/staff-web-push.js
          node --input-type=module --check < cloudflare-pages/functions/api/staff-push.js
          node --input-type=module --check < cloudflare-pages/functions/api/bali-v3.js
          node --input-type=module --check < cloudflare-pages/functions/api/d1-preorders.js
          node --input-type=module --check < bali-staff-push.js
          node --check bali-staff-sw.js
      - name: Verify Web Push encryption, VAPID and receipt handling
        run: node scripts/test-staff-web-push.mjs
      - name: Verify existing guest/Staff order contract
        run: node --experimental-sqlite scripts/test-d1-live-preorders.mjs
      - name: Verify Cloudflare Pages output
        run: node cloudflare-pages/build.mjs
