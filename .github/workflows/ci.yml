name: Проверка BALI MENU

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка JavaScript
        run: |
          node --check app.js
          node --input-type=module --check < auth.js
          node --input-type=module --check < bali-id-flip.js
          node --input-type=module --check < bali-id.js
          node --input-type=module --check < bali-id-bank.js
          node --check functions/index.js
          node --input-type=module --check < bali-privilege-admin.js
          node --input-type=module --check < bali-director-id.js
          node --input-type=module --check < bali-bonus-transfer-scaffold.js
          node --check bali-info-page.js
          node --input-type=module --check < menu-firestore.js
          node --input-type=module --check < admin-firestore.js
          node --input-type=module --check < menu-seed.js
          node --input-type=module --check < orders-firestore.js
          node --input-type=module --check < admin-orders.js
          node --input-type=module --check < admin-clients.js
          node --input-type=module --check < image-compressor.js
          node --input-type=module --check < event-interests.js
          node --check admin-dashboard.js
          node --check bali-pc-reference.js
          node --input-type=module --check < bali-admin-cards.js
          node --input-type=module --check < bali-pc-offers.js
          node --input-type=module --check < bali-admin-promos.js
          node --input-type=module --check < bali-extra-menus.js
          node --input-type=module --check < bali-menu-visibility.js
          node --input-type=module --check < bali-design-variants.js
          node --input-type=module --check < bali-home-design-admin.js
          node --input-type=module --check < bali-home-design.js
          node --input-type=module --check < bali-mobile-about-hero.js
          node --input-type=module --check < bali-mobile-about-admin.js
          node --input-type=module --check < bali-catalog-details.js
          node --input-type=module --check < bali-menu-cards.js
          node --input-type=module --check < bali-bar-menu.js
          node --input-type=module --check < bali-site-content-admin.js
          node --input-type=module --check < bali-site-content.js
          node --input-type=module --check < bali-home-placeholder.js
          node --input-type=module --check < bali-home-placeholder-admin.js
          node --check bali-design-studio.js
          node --check admin.js
          node --check track.js
          node --check firebase-config.js
          node --check < Code.gs
          node --check scripts/prepare-firebase-config.mjs
          node --check scripts/verify-source.mjs
      - name: Проверка интерфейса и безопасных ограничений
        run: |
          node scripts/verify-source.mjs
          node scripts/verify-bali-bank.mjs

      - name: Проверка защищённых переводов BALI ID
        run: |
          node scripts/verify-bali-transfers.mjs
          node scripts/test-bali-backend.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:styles
      - run: npx playwright install --with-deps chromium
      - name: Проверка гостевых сценариев на телефоне и ПК (без доступа к Firebase)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  firebase-emulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - name: Test Auth, Firestore and Storage in isolated demo project
        run: npm run test:firebase
