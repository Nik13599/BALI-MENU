name: BALI unified D1 orders cutover
on:
  push:
    branches:
      - feature/d1-live-preorders-cutover-20261023
  pull_request:
    paths:
      - 'cloudflare-pages/functions/_lib/d1-orders.js'
      - 'cloudflare-pages/functions/_lib/staff-auth.js'
      - 'cloudflare-pages/functions/api/bali-v3.js'
      - 'bali-sheets-config.js'
      - 'bali-sheets-api.js'
      - 'admin-orders.js'
      - 'preorders-access.js'
      - 'orders-firestore.js'
      - 'scripts/test-d1-live-orders.mjs'
      - '.github/workflows/d1-live-orders.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate backend and client modules
        run: |
          node --input-type=module --check < cloudflare-pages/functions/_lib/d1-orders.js
          node --input-type=module --check < cloudflare-pages/functions/_lib/staff-auth.js
          node --input-type=module --check < cloudflare-pages/functions/api/bali-v3.js
          node --input-type=module --check < admin-orders.js
          node --input-type=module --check < preorders-access.js
          node --input-type=module --check < orders-firestore.js
      - name: Verify atomic D1 guest, Staff and registered orders on SQLite
        run: node --experimental-sqlite scripts/test-d1-live-orders.mjs
      - name: Preserve BALI Staff visual design
        run: node scripts/test-staff-appearance-locked.mjs
      - name: Build Cloudflare Pages
        run: node cloudflare-pages/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Guest checkout and Staff UI smoke tests
        run: npx playwright test tests/guest-preorder-staging.spec.cjs tests/preorders-workspace.spec.cjs --project=phone --project=desktop
