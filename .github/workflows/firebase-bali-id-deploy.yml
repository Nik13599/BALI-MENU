name: BALI ID — Deploy Firebase Backend

# Production writes are intentionally never published by the Pages workflow.
# Start this workflow only after verifying Firebase billing and security rules.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Подтвердите проект Firebase для реальных бонусов"
        type: choice
        required: true
        options:
          - bali-menu-5a48b

permissions:
  contents: read
  id-token: write

concurrency:
  group: bali-id-firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate backend, browser and Firestore restrictions
        run: |
          node --check functions/index.js
          node --input-type=module --check < bali-id-bank.js
          node scripts/verify-bali-transfers.mjs
          node scripts/verify-source.mjs
      - name: Validate Firebase identity configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "bali-menu-5a48b"
          test -n "$PROVIDER" || (echo "::error::Configure FIREBASE_WIF_PROVIDER in firebase-production environment" && exit 1)
          test -n "$SERVICE_ACCOUNT" || (echo "::error::Configure FIREBASE_DEPLOY_SERVICE_ACCOUNT in firebase-production environment" && exit 1)
      - name: Google Cloud workload identity (no static keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Firebase CLI and function dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix functions --no-audit --no-fund
      - name: Deploy callable functions and locked-down Firestore rules
        run: |
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions,firestore:rules --non-interactive
      - name: Deploy history index (may take time to build)
        run: |
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:indexes --non-interactive
