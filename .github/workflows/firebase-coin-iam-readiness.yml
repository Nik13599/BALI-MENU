name: Firebase BALI COIN + BRSM — read-only IAM readiness

on:
  workflow_dispatch:
  # One-time read-only diagnosis whenever this workflow itself is reviewed and
  # updated on the protected default branch; never deploy on this event.
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-coin-iam-readiness.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-pilot-uids:
    name: Verify test-only Firebase UID allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-production
    env:
      PILOT_UIDS: ${{ secrets.BALI_COIN_PILOT_UIDS }}
    steps:
      - name: Check protected pilot secret without showing UIDs
        shell: bash
        run: |
          node <<'NODE'
          const ids=String(process.env.PILOT_UIDS||"").split(",").map(x=>x.trim());
          const valid=ids.length>=2&&ids.length<=10&&
            ids.every(x=>/^[A-Za-z0-9_-]{8,128}$/.test(x))&&
            new Set(ids).size===ids.length;
          const summary=require("node:fs");
          if(!valid){
            console.log("::warning::BALI_COIN_PILOT_UIDS is missing or malformed. Set 2-10 dedicated TEST Firebase UIDs in Settings > Environments > firebase-production > Environment secrets. IAM diagnostics continue independently.");
            summary.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### BALI COIN pilot: NOT READY\\n\\n"+
              "Dedicated test Firebase UIDs are missing or invalid. **No production coin release is allowed.** "+
              "Add 2-10 distinct test Authentication UIDs to the protected BALI_COIN_PILOT_UIDS environment secret.\\n");
          }else{
            console.log("Pilot UID allowlist format OK. Actual Firebase users still require server-side verification before release.");
            summary.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### BALI COIN pilot: format OK\\n\\n"+
              "Protected UID format is valid. The existence of Firebase users and Bali Card records has not yet been verified.\\n");
          }
          NODE

  verify-firebase-access:
    name: Verify Firebase Functions v2 IAM separately
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: bali-menu-5a48b
      FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check deployer settings independently of test UIDs
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "bali-menu-5a48b"
          test -n "$FIREBASE_WIF_PROVIDER"
          if [ -z "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Set FIREBASE_DEPLOY_SERVICE_ACCOUNT in firebase-production Environment variables or repository Actions Variables."
            exit 1
          fi
      - name: Authenticate Firebase deployer without a static JSON key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ env.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: bali-menu-5a48b
      - name: Determine existing runtime identities and active Cloud Functions v2 configuration
        shell: bash
        run: |
          set -euo pipefail
          NUMBER="$(gcloud projects describe "$FIREBASE_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$NUMBER" =~ ^[0-9]+$ ]]
          COMPUTE="${NUMBER}-compute@developer.gserviceaccount.com"
          APPENGINE="${FIREBASE_PROJECT_ID}@appspot.gserviceaccount.com"
          echo "Project number resolved (not printed); inspecting two known default runtime identities."

          check_identity() {
            local name="$1" email="$2" output
            output="$(mktemp)"
            if gcloud iam service-accounts describe "$email" --project "$FIREBASE_PROJECT_ID" \
                --format='value(disabled)' >"$output" 2>&1; then
              echo "$name: service account exists and is readable."
              if grep -q '^True$' "$output"; then
                echo "::error::$name is disabled. A project IAM owner must enable or replace it."
                rm -f "$output"
                return 1
              fi
            else
              echo "::warning::$name: unable to read account. It may be absent, deleted, or hidden by IAM policy. No account was created."
            fi
            rm -f "$output"
            return 0
          }
          check_identity "Compute Engine default" "$COMPUTE"
          check_identity "App Engine default" "$APPENGINE"

          # Lookup is optional: the deployment identity may not have permission
          # to list Cloud Functions. This never blocks a correct IAM check.
          if gcloud functions list --gen2 --regions=europe-west1 \
            --project="$FIREBASE_PROJECT_ID" \
            --format='value(serviceConfig.serviceAccountEmail)' >/tmp/bali-v2-runtime-ids 2>/dev/null; then
            if [ -s /tmp/bali-v2-runtime-ids ]; then
              echo "Existing v2 function runtime accounts (deduplicated, no identifiers printed):"
              sort -u /tmp/bali-v2-runtime-ids | while IFS= read -r actual; do
                [ -n "$actual" ] || continue
                if [ "$actual" = "$COMPUTE" ]; then echo "  - Compute Engine default"
                elif [ "$actual" = "$APPENGINE" ]; then echo "  - App Engine default"
                else echo "  - Dedicated custom service account"; fi
              done
            else
              echo "No current Cloud Functions v2 runtimes were listed."
            fi
          else
            echo "::notice::Unable to list existing Cloud Functions v2 runtimes with this deployer. IAM probe continues."
          fi
          rm -f /tmp/bali-v2-runtime-ids

      - name: Check IAM actAs for the default v2 runtime only if it exists
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$FIREBASE_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]
          TARGET="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          RESP="$(mktemp)"
          trap 'rm -f "$RESP"' EXIT
          TOKEN="$(gcloud auth print-access-token)"
          STATUS="$(curl --silent --show-error --output "$RESP" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"permissions":["iam.serviceAccounts.actAs"]}' \
            "https://iam.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/serviceAccounts/$TARGET:testIamPermissions")"
          if [ "$STATUS" = 404 ]; then
            echo "::error::Compute Engine default service account returned HTTP 404. It is missing or invisible to this IAM caller. Google Cloud owner: inspect Service Accounts and either restore the default or configure an approved least-privileged custom v2 runtime identity with actAs. Do not deploy with a guessed account."
            echo "### Blocked: default Cloud Functions v2 identity not found (HTTP 404)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$STATUS" != 200 ]; then
            echo "::error::Service-account IAM probe returned HTTP $STATUS. This is NOT proof that iam.serviceAccounts.actAs is missing."
            exit 1
          fi
          node - "$RESP" <<'NODE'
          const fs=require("node:fs");
          const data=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(!Array.isArray(data.permissions)||!data.permissions.includes("iam.serviceAccounts.actAs")){
            console.error("::error::Firebase deployer lacks iam.serviceAccounts.actAs on the default Compute runtime account. Grant roles/iam.serviceAccountUser on that identity only.");
            process.exitCode=1;
          }else console.log("Cloud Functions v2 default runtime actAs: confirmed.");
          NODE
      - name: Summarize read-only IAM result
        run: |
          echo "### Firebase Functions v2 IAM readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "WIF identity and Compute runtime actAs permission are valid." >> "$GITHUB_STEP_SUMMARY"
          echo "This test never deploys functions or changes COIN, BRSM, Firestore, or Cloudflare." >> "$GITHUB_STEP_SUMMARY"
