name: Firebase BALI COIN + BRSM — read-only IAM readiness

on:
  workflow_dispatch:
  # One-time read-only diagnosis whenever this workflow itself is reviewed and
  # updated on the protected default branch; never deploy on this event.
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-coin-iam-readiness.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-pilot-uids:
    name: Verify test-only Firebase UID allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-production
    env:
      PILOT_UIDS: ${{ secrets.BALI_COIN_PILOT_UIDS }}
    steps:
      - name: Check protected pilot secret without showing UIDs
        shell: bash
        run: |
          node <<'NODE'
          const ids=String(process.env.PILOT_UIDS||"").split(",").map(x=>x.trim());
          const valid=ids.length>=2&&ids.length<=10&&
            ids.every(x=>/^[A-Za-z0-9_-]{8,128}$/.test(x))&&
            new Set(ids).size===ids.length;
          const summary=require("node:fs");
          if(!valid){
            console.log("::warning::BALI_COIN_PILOT_UIDS is missing or malformed. Set 2-10 dedicated TEST Firebase UIDs in Settings > Environments > firebase-production > Environment secrets. IAM diagnostics continue independently.");
            summary.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### BALI COIN pilot: NOT READY\\n\\n"+
              "Dedicated test Firebase UIDs are missing or invalid. **No production coin release is allowed.** "+
              "Add 2-10 distinct test Authentication UIDs to the protected BALI_COIN_PILOT_UIDS environment secret.\\n");
          }else{
            console.log("Pilot UID allowlist format OK. Actual Firebase users still require server-side verification before release.");
            summary.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### BALI COIN pilot: format OK\\n\\n"+
              "Protected UID format is valid. The existence of Firebase users and Bali Card records has not yet been verified.\\n");
          }
          NODE

  verify-firebase-access:
    name: Verify Firebase Functions v2 IAM separately
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: bali-menu-5a48b
      FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check deployer settings independently of test UIDs
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "bali-menu-5a48b"
          test -n "$FIREBASE_WIF_PROVIDER"
          if [ -z "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Set FIREBASE_DEPLOY_SERVICE_ACCOUNT in firebase-production Environment variables or repository Actions Variables."
            exit 1
          fi
      - name: Authenticate Firebase deployer without a static JSON key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ env.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: bali-menu-5a48b
      - name: Read-only check of runtime IAM actAs for Cloud Functions v2
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$FIREBASE_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]
          TARGET="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          TOKEN="$(gcloud auth print-access-token)"
          RESULT="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"permissions":["iam.serviceAccounts.actAs"]}' \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/$TARGET:testIamPermissions")"
          printf '%s' "$RESULT" | node -e '
            let input="";
            process.stdin.on("data",chunk=>input+=chunk);
            process.stdin.on("end",()=>{
              const value=JSON.parse(input);
              if(!Array.isArray(value.permissions)||!value.permissions.includes("iam.serviceAccounts.actAs")){
                console.error("::error::GitHub deployer lacks roles/iam.serviceAccountUser on the Compute Engine default service account used by Firebase Functions v2.");
                process.exitCode=1;
              }else console.log("Firebase Functions v2 runtime IAM permission OK.");
            });
          '
      - name: Summarize read-only IAM result
        run: |
          echo "### Firebase Functions v2 IAM readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "WIF identity and Compute runtime actAs permission are valid." >> "$GITHUB_STEP_SUMMARY"
          echo "This test never deploys functions or changes COIN, BRSM, Firestore, or Cloudflare." >> "$GITHUB_STEP_SUMMARY"
