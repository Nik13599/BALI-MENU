name: Import approved BALI original New Year artwork
# One-time transfer of the user's unmodified PNG into the repository.
on:
  push:
    branches:
      - fix/new-year-banner-exact-image
    paths:
      - .github/workflows/import-bali-newyear-original.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-year-banner-exact-image
          persist-credentials: true
      - name: Download exact approved image
        run: |
          curl --fail --location --show-error --retry 3 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3Ccuvf8NZIxqatzfRasoamOkOq9/400d083a-d177-47fc-a811-72c83e93dcef.png' \
            --output 'assets/BALI_banner_badge_rectangular_only.png'
          echo '6723854d7308c44d3f8f422971337891b39adc01d080b626c4e08f91b67f7cb4  assets/BALI_banner_badge_rectangular_only.png' | sha256sum --check
      - name: Commit exact original image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/BALI_banner_badge_rectangular_only.png
          git commit -m "asset: add original approved BALI New Year banner (unchanged bytes)"
          git push origin HEAD:fix/new-year-banner-exact-image
