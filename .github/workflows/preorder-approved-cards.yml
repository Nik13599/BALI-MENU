name: BALI approved preorder card layout
on:
  push:
    branches: [main]
    paths:
      - "admin-orders.js"
      - "preorders.html"
      - "preorders-workspace.css"
      - "tests/preorder-approved-cards.spec.cjs"
      - ".github/workflows/preorder-approved-cards.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --input-type=module --check < admin-orders.js
      - run: npm run check:styles
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/preorder-approved-cards.spec.cjs
