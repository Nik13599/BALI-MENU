name: BALI — Activate preorder staff login
# Deploy only the dedicated preorder-employee callable, then enable email/password
# provider without disabling the existing Google sign-in. Never export credentials.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preorder-staff-activate.yml'
      - 'functions/preorder-staff.js'
      - 'functions/index.js'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bali-preorder-staff-firebase-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify preorder roles and staff code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check functions/index.js
          node --check functions/preorder-staff.js
          node --input-type=module --check < preorders-access.js
          node --input-type=module --check < preorder-staff-admin.js
          node scripts/test-bali-backend.mjs
          node scripts/test-preorder-reports.mjs
      - run: npm run test:firebase

  deploy:
    name: Publish staff function and password provider to Firebase production
    needs: verify
    runs-on: ubuntu-latest
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: bali-menu-5a48b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment scope and identity settings
        env:
          PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "bali-menu-5a48b"
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - name: Authenticate through Google Cloud Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Firebase deployment tools
        run: |
          npm install -g firebase-tools@15.34.0
          npm install --prefix functions --no-audit --no-fund
      - name: Install Google Cloud auth CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy only preorder staff management function
        id: deploy_staff
        run: |
          firebase deploy --project "$FIREBASE_PROJECT_ID" \
            --only "functions:bali-id:manageBaliPreorderStaff" --non-interactive
      - name: Enable password sign-in while preserving Google provider
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/${FIREBASE_PROJECT_ID}/config"
          HTTP_CODE="$(curl -sS -o /tmp/bali-auth-config.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$CONFIG_URL")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cannot read Firebase Auth provider config (HTTP $HTTP_CODE). Check service account Identity Toolkit permissions."
            exit 1
          fi
          if node -e "const c=require('/tmp/bali-auth-config.json');process.exit(c.signIn?.email?.enabled===true && c.signIn?.email?.passwordRequired===true?0:1)"; then
            echo "Firebase Email/Password sign-in is already enabled."
          else
            CODE="$(curl -sS -o /tmp/bali-auth-updated.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}' \
              "$CONFIG_URL?updateMask=signIn.email.enabled,signIn.email.passwordRequired")"
            if [ "$CODE" != "200" ]; then
              echo "::error::Failed to enable Firebase password provider (HTTP $CODE). A project owner can enable it in Authentication > Sign-in method."
              exit 1
            fi
            echo "Firebase Email/Password sign-in enabled; existing Google sign-in unchanged."
          fi
      - name: Confirm Firebase password provider is active
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/${FIREBASE_PROJECT_ID}/config"
          curl -sSf -H "Authorization: Bearer $TOKEN" "$CONFIG_URL" \
            | node -e 'let text="";process.stdin.on("data",x=>text+=x).on("end",()=>{const c=JSON.parse(text); if(!c.signIn?.email?.enabled||!c.signIn?.email?.passwordRequired)process.exit(1);console.log("Firebase password authentication is ACTIVE.")})'

      - name: Explain required Firebase activation permissions
        if: failure()
        run: |
          echo "::error::Staff registration is not active. The Firebase deploy identity must be authorized for Cloud Functions/Cloud Build and Identity Toolkit configuration."
          echo "::notice::Project owner: enable the Cloud Functions and Cloud Build APIs, then grant the deployment service account the minimum necessary roles for deploying functions and configuring Firebase Auth."
          echo "::notice::Cloud Functions API: https://console.cloud.google.com/apis/library/cloudfunctions.googleapis.com?project=$FIREBASE_PROJECT_ID"
          echo "::notice::Cloud Build API: https://console.cloud.google.com/apis/library/cloudbuild.googleapis.com?project=$FIREBASE_PROJECT_ID"
          echo "::notice::Artifact Registry API: https://console.cloud.google.com/apis/library/artifactregistry.googleapis.com?project=$FIREBASE_PROJECT_ID"
          echo "::notice::Firebase billing: https://console.firebase.google.com/project/$FIREBASE_PROJECT_ID/usage"
          echo "::notice::Artifact Registry API: https://console.cloud.google.com/apis/library/artifactregistry.googleapis.com?project=$FIREBASE_PROJECT_ID"
          echo "::notice::Firebase Authentication: https://console.firebase.google.com/project/$FIREBASE_PROJECT_ID/authentication/providers"
          echo "::notice::IAM: https://console.cloud.google.com/iam-admin/iam?project=$FIREBASE_PROJECT_ID"
