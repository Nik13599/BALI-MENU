name: BALI — Provision existing staff01 account
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-existing-preorder-staff.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: bali-provision-existing-staff01
  cancel-in-progress: false
jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Provision existing BALI staff01 account'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: firebase-production
    env:
      BALI_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      BALI_STAFF_LOGIN: staff01
      BALI_STAFF_EXPECTED_UID: PpentrythOSBDg9ShRmiucXfK7G3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Authenticate using the existing project deployment identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER || 'projects/855889005555/locations/global/workloadIdentityPools/bali-github-pool/providers/bali-github' }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm install --prefix functions --no-audit --no-fund
      - run: node --check scripts/provision-existing-preorder-staff.cjs
      - name: Inspect the exact existing Firebase employee identity
        run: node scripts/provision-existing-preorder-staff.cjs
      - name: Verify the existing dedicated Firebase staff account
        run: node scripts/provision-existing-preorder-staff.cjs --apply
      - name: Verify limited staff access against the existing order backend
        run: node scripts/provision-existing-preorder-staff.cjs --verify-backend
