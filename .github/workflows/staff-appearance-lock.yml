name: BALI Staff appearance lock
on:
  push:
    branches: [main]
    paths:
      - 'preorders-workspace.css'
      - 'preorders.html'
      - 'admin-orders.js'
      - 'preorders-access.js'
      - 'scripts/test-staff-appearance-locked.mjs'
      - '.github/workflows/staff-appearance-lock.yml'
      - 'tests/calendar-reference-2026.spec.cjs'
  pull_request:
    paths:
      - 'preorders-workspace.css'
      - 'preorders.html'
      - 'admin-orders.js'
      - 'preorders-access.js'
      - 'scripts/test-staff-appearance-locked.mjs'
      - '.github/workflows/staff-appearance-lock.yml'
      - 'tests/calendar-reference-2026.spec.cjs'
permissions:
  contents: read
jobs:
  no-staff-ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce approved desktop, tablet and mobile styling
        run: node scripts/test-staff-appearance-locked.mjs
  bali-id-hit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify visible BALI ID card can be flipped on phone and PC
        run: npx playwright test tests/calendar-reference-2026.spec.cjs --project=phone --project=desktop --grep 'BALI ID keeps its enlarged card'
