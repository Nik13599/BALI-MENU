<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#090b0d"><title>BALI — Проверка видео</title><style>*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#f7f7f6;font-family:Arial,Helvetica,sans-serif}main{width:min(960px,calc(100% - 32px));margin:36px auto}h1{font-size:clamp(23px,5vw,40px);margin:0 0 12px;letter-spacing:-.03em}p{color:#acb5b8;line-height:1.6} .frame{position:relative;aspect-ratio:16/9;background:#040505;border:1px solid #30363a;border-radius:16px;overflow:hidden}.frame:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border:0;border-radius:0}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.actions button,.actions a{font:700 14px Arial;color:#10150a;background:#b9ff51;padding:13px 18px;border:0;border-radius:12px;text-decoration:none;cursor:pointer}.actions a{background:#21282b;color:#f2f2f2;border:1px solid #424a4f}small{color:#b0b8b8;display:block;margin-top:15px;line-height:1.6}</style></head><body><main><h1>BALI — ВИДЕО О КЛУБЕ</h1><p>Проверка просмотра YouTube-видео непосредственно на HTTPS-сайте BALI.</p><div id="frame" class="frame"><iframe title="BALI NIGHTCLUB — видео о клубе" src="https://www.youtube.com/embed/8dwJTWfvsVY?playsinline=1&amp;rel=0&amp;fs=1" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe></div><div class="actions"><button id="expand">⛶ Развернуть видео</button><a href="https://youtu.be/8dwJTWfvsVY" target="_blank" rel="noopener noreferrer">Открыть оригинал ↗</a></div><small>Это отдельная проверочная страница. Существующее меню и главная сайта не изменены. Если YouTube не разрешает встраивание конкретного ролика, кнопка «Открыть оригинал» остаётся доступной.</small></main><script>document.getElementById('expand').addEventListener('click',async()=>{const el=document.getElementById('frame');try{if(document.fullscreenElement)await document.exitFullscreen();else if(el.requestFullscreen)await el.requestFullscreen();}catch(e){}});</script></body></html>
