<!doctype html>
<html lang="ru" data-bali-theme="lime">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>BALI · Предзаказы</title><link rel="icon" href="assets/bali-favicon.svg">
<style>
:root{color-scheme:dark;font-family:Manrope,Inter,system-ui,sans-serif;background:#090c0a;color:#f3f5f0}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
header{position:sticky;top:0;z-index:5;background:#111612ee;backdrop-filter:blur(12px);border-bottom:1px solid #303b31;padding:10px max(12px,calc((100vw - 1300px)/2));display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:17px;font-weight:850;letter-spacing:.07em}.accent{color:#b4ed46}a{color:inherit}header a{font-size:12px;color:#a8b4a7}
main{max-width:1300px;margin:auto;padding:12px}h1{font-size:19px;margin:0}h2{font-size:18px;margin:0}.sub{font-size:12px;color:#aab7a9}.bar,.stats,.filters,.actions,.top,.bottom{display:flex;gap:7px;align-items:center}.bar{justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.stats{gap:6px}.metric{background:#182019;padding:7px 10px;border:1px solid #344136;border-radius:9px;font-size:12px}.metric strong{font-size:16px;color:#d5f997}
button,.btn{background:#1d281e;border:1px solid #435643;color:#f0f5ec;padding:8px 10px;border-radius:8px;font-size:12px;white-space:nowrap;text-decoration:none}button:hover,.btn:hover{border-color:#a2d956}.green{background:#b7ed54;color:#0b130a;border-color:#b7ed54;font-weight:750}.danger{background:#3c1e20;border-color:#8e4046;color:#ffb9b9}.muted{color:#b5c5b3}
input,select{background:#171d18;border:1px solid #3d493e;color:#f4f6f0;border-radius:8px;padding:9px;min-width:0;font-size:13px}input[type=search]{flex:1;min-width:150px}.filters{margin-bottom:12px;flex-wrap:wrap}.filters select{max-width:220px}.orders{display:grid;gap:7px}.order{border:1px solid #344235;background:#141b15;border-radius:10px;padding:10px}.top,.bottom{justify-content:space-between;align-items:flex-start}.bottom{align-items:flex-end;margin-top:6px}.order-left{min-width:0;flex:1}.identity{font-size:13px;font-weight:650;line-height:1.5}.identity span{font-weight:500}.right{flex:0 0 auto;text-align:right}.actions{justify-content:flex-end;flex-wrap:wrap}.actions button{padding:6px 8px}.bottom .person{font-size:13px;line-height:1.5;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.price{font-size:14px;font-weight:800;white-space:nowrap;color:#e8fbd6}.status{font-size:12px;color:#baf289}.status.cancelled{color:#ffa7a7;background:none;border:0}.call{display:inline-flex;padding:5px 8px;color:#c7f893;text-decoration:none;background:#243022;border-radius:6px}.more{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}.more button{padding:6px 9px}.empty{padding:40px 12px;text-align:center;color:#b8c7b6}
dialog{border:1px solid #425543;background:#141b15;color:#f0f6ed;border-radius:14px;padding:0;width:min(680px,calc(100vw - 16px));max-height:calc(100dvh - 16px);box-shadow:0 20px 80px #0009}dialog::backdrop{background:#000b}.sheet{padding:15px;overflow:auto;max-height:calc(100dvh - 18px)}.sheethead{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}.info{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 8px;background:#253125;border-radius:7px;font-size:12px}.itemrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #303b31;font-size:13px}.total{display:flex;justify-content:space-between;margin:13px 0;font-weight:800;font-size:16px}.dialogActions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.notice{font-size:12px;color:#ced9c9}.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.editgrid label{display:grid;gap:4px;color:#a9baa7;font-size:12px}.editgrid input,.editgrid select{width:100%}.full{grid-column:1/-1}#message{font-size:12px;color:#cee5b9;margin:5px 0}#login{max-width:460px;margin:10vh auto;padding:30px;border-radius:16px;border:1px solid #334134;background:#151c16}
@media(max-width:620px){header{padding:10px 12px}.filters select{flex:1;max-width:none}.metric{padding:6px;font-size:11px}.order{padding:8px}.identity,.bottom .person{font-size:13px}.top{gap:5px}.actions{gap:4px}.actions button{padding:5px 7px}.more button{font-size:11px}.sheet{padding:12px}.editgrid{grid-template-columns:1fr}.bottom .person{gap:4px}.price{font-size:13px}}
@media print{header,.bar,.filters,.orders,.dialogActions,#message{display:none!important}main{display:none}dialog{position:static;border:0;box-shadow:none;width:100%;max-height:none;color:#000;background:#fff}dialog::backdrop{background:#fff}.sheet{max-height:none;overflow:visible}body{background:#fff;color:#000}.itemrow{border-color:#aaa}.chip{color:#000;background:#eee}.sheethead button{display:none}}
</style>
<script src="firebase-config.js"></script>
</head><body>
<header><div class="brand">BALI <span class="accent">ПРЕДЗАКАЗЫ</span></div><a href="admin.html">Общая админка ↗</a></header>
<main>
<section id="login"><h1>Служебный кабинет предзаказов</h1><p class="sub">Только для сотрудников с правами администратора.</p><button class="green" id="signin">Войти через Google</button><p id="authStatus" class="notice"></p></section>
<section id="dashboard" hidden>
<div class="bar"><h1>Предзаказы</h1><div class="stats"><span class="metric">Всего <strong id="countAll">0</strong></span><span class="metric">Ожидают <strong id="countPending">0</strong></span><span class="metric">Подтверждены <strong id="countConfirmed">0</strong></span></div><button id="export" title="Экспорт отфильтрованных заказов">↓ CSV</button><button id="newOrder" class="green">+ Новый заказ</button></div>
<div class="filters"><input type="search" id="search" placeholder="Имя, телефон, номер заказа, столик"><select id="date"><option value="">Все даты</option></select><select id="event"><option value="">Все мероприятия</option></select><select id="status"><option value="">Все статусы</option><option value="pending">Ожидают</option><option value="confirmed">Подтверждены</option><option value="completed">Выполнены</option><option value="cancelled">Отменены</option></select></div>
<p id="message" role="status"></p><div id="orders" class="orders"></div>
</section>
</main>
<dialog id="detail"><div class="sheet">
<div class="sheethead"><div><div class="sub">BALI · ПОЛНАЯ КАРТОЧКА</div><h2 id="detailTitle"></h2><p id="detailDate" class="sub"></p></div><button id="closeX" aria-label="Закрыть">✕</button></div>
<div class="info" id="detailInfo"></div><div id="detailItems"></div><div class="total"><span>Итого</span><strong id="detailTotal"></strong></div><div id="detailNote" class="notice"></div>
<div id="editArea" hidden></div><div id="shareArea" hidden></div>
<div class="dialogActions"><button id="close">Закрыть</button><button id="share">↗ Переслать</button><button id="edit">✎ Редактировать</button><button id="print">▣ Распечатать</button><button class="danger" id="cancel">Отменить заказ</button><button class="danger" id="delete">Удалить заказ</button></div><p id="detailMessage" role="status" class="notice"></p>
</div></dialog>
<script type="module" src="preorders-app.js?v=1"></script>
</body></html>
